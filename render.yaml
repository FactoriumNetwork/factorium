services:
  - type: web
    name: factorium
    env: node
    buildCommand: npm run render-build
    startCommand: node dist/src/start.js
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "22.0.0"
      - key: DATABASE_URL
        sync: false
      - key: ALBY_HUB_URL
        sync: false
      - key: ALBY_ACCESS_TOKEN
        sync: false
      - key: SEED_VERIFIER_PRIVATE_KEY
        sync: false
      - key: X402_ENABLED
        sync: false
